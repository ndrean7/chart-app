<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>Chart Ndrean</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f17'/%3E%3Cpath d='M6 22l6-7 5 4 9-11' stroke='%2322d3a6' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b0f17;--panel:#121826;--panel2:#182033;--line:#243049;--text:#e6ebf5;--muted:#8a96ad;--accent:#22d3a6;--up:#22c58b;--down:#f0506e;--warn:#f5b84a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;background:var(--bg)}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
#symBtn{display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;color:var(--text);padding:4px 6px;border-radius:10px;min-height:44px;cursor:pointer;min-width:0;max-width:62%}
#symName{font-weight:700;font-size:17px;letter-spacing:.2px;white-space:nowrap}
#symName::after{content:" ▾";color:var(--muted);font-size:13px}
#symSub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#priceBox{margin-left:auto;text-align:right;flex:none}
#lastPrice{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
#chg{font-size:12px;font-variant-numeric:tabular-nums}
#status{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
#status.live{background:var(--up);box-shadow:0 0 8px var(--up)}
#status.poll{background:var(--warn)}
#status.daily{background:#7c9cff}
.topbar{display:flex;align-items:center;gap:6px;padding:5px 6px;border-bottom:1px solid var(--line);background:var(--bg);flex:none}
#tfBar{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
#tfBar::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:34px;height:36px;padding:0 7px;border-radius:9px;border:1px solid transparent;background:none;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
.chip.on{color:var(--text);background:var(--panel2);border-color:var(--line)}
.chip:disabled{opacity:.3}
.ibtn{flex:none;height:36px;min-width:40px;padding:0 9px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:600;cursor:pointer}
.ibtn svg{width:20px;height:20px}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#mainWrap{position:relative;flex:none;overflow:hidden}
#chart{position:absolute;left:0;top:0}
#overlay{position:absolute;left:0;top:0;pointer-events:none;z-index:5;touch-action:none}
#overlay.active{pointer-events:auto}
.pane{position:relative;border-top:1px solid var(--line);flex:none}
.pane .plabel{position:absolute;left:8px;top:4px;z-index:3;font-size:11px;color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums}
#legend{position:absolute;left:58px;top:6px;background:rgba(11,15,23,.62);border-radius:8px;padding:2px 6px;z-index:4;font-size:12px;color:var(--muted);pointer-events:none;line-height:1.55;font-variant-numeric:tabular-nums;max-width:calc(100% - 150px)}
#legend b{color:var(--text);font-weight:600}
#legend .o{white-space:nowrap}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);z-index:3;font-size:14px;text-align:center;padding:20px}
#toolbar{position:absolute;left:6px;top:6px;z-index:8;display:flex;flex-direction:column;gap:2px;background:rgba(18,24,38,.95);border:1px solid var(--line);border-radius:14px;padding:3px;max-height:calc(100% - 44px);overflow-y:auto;scrollbar-width:none;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#toolbar::-webkit-scrollbar{display:none}
#toolbar.collapsed .tb{display:none}
#toolbar.collapsed .sep{display:none}
.tb,#tbToggle{width:42px;height:42px;border-radius:10px;border:0;background:none;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.tb svg,#tbToggle svg{width:22px;height:22px}
.tb.on{background:rgba(34,211,166,.16);color:var(--accent)}
.tb.danger{color:#ff8fa3}
#tbToggle{color:var(--accent)}
.sep{height:1px;background:var(--line);margin:3px 6px;flex:none}
#hint{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);z-index:9;background:rgba(18,24,38,.96);border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:999px;font-size:13px;display:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#selBar{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);z-index:9;display:none;align-items:center;gap:4px;background:rgba(18,24,38,.97);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#selBar.show{display:flex}
.sw6{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex:none;padding:0}
.sw6.on{border-color:#fff}
.sb{height:36px;min-width:36px;padding:0 8px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sb svg{width:18px;height:18px}
.sb.del{color:#ff8fa3}
.sb.on{border-color:var(--accent);color:var(--accent)}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:18px;padding:0;width:min(94vw,440px);max-height:86vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog[open]{display:flex;flex-direction:column}
.dlg-h{padding:12px 8px 12px 16px;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex:none}
.dlg-b{padding:12px 14px;overflow-y:auto}
.x{background:none;border:0;color:var(--muted);font-size:24px;min-width:44px;min-height:40px;cursor:pointer}
.tabs{display:flex;gap:4px;padding:10px 14px 0;flex:none}
.tab{flex:1;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-weight:700;font-size:13px;cursor:pointer}
.tab.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.inp{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 14px;font-size:16px;-webkit-user-select:text;user-select:text}
#search{text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.sym{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:700;font-size:14px;cursor:pointer;text-align:left;padding:6px 12px;line-height:1.25}
.sym small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.sym.cur{border-color:var(--accent)}
.gh{grid-column:1/-1;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.6px;margin-top:6px;text-transform:uppercase}
.btn{min-height:46px;border-radius:12px;border:0;background:var(--accent);color:var(--bg);font-weight:700;font-size:15px;padding:0 16px;cursor:pointer;width:100%;margin-top:10px}
.btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.err{color:#ff8fa3;font-size:13px;margin-top:6px;min-height:0}
.note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5}
.note a{color:var(--muted)}
.ind{display:flex;align-items:center;gap:8px;min-height:52px;border-bottom:1px solid var(--line);font-size:14.5px}
.ind:last-child{border-bottom:0}
.ind .nm{flex:1;display:flex;align-items:center;min-width:0}
.ind input{width:54px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);text-align:center;font-size:14px;-webkit-user-select:text;user-select:text}
.sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--accent)}.sw.on::after{left:23px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;flex:none}
.menu{display:flex;flex-direction:column;gap:6px}
.mi{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;text-align:left}
.mi svg{width:22px;height:22px;flex:none;color:var(--muted)}
.mi .r{margin-left:auto;color:var(--muted);font-size:13px;font-weight:500}
.mi.danger{color:#ff8fa3}
.mi:disabled{opacity:.35}
</style>
</head>
<body>
<div id="app">
  <header>
    <span id="status" title="Status data"></span>
    <button id="symBtn" aria-label="Ganti pair"><span id="symName">BTC/USDT</span><span id="symSub">Crypto</span></button>
    <div id="priceBox"><div id="lastPrice">—</div><div id="chg">—</div></div>
  </header>
  <div class="topbar">
    <div id="tfBar"></div>
    <button class="ibtn" id="btnType" aria-label="Tipe chart"></button>
    <button class="ibtn" id="btnInd" aria-label="Indikator"><span style="font-style:italic;font-weight:700;font-size:15px">fx</span></button>
    <button class="ibtn" id="btnMore" aria-label="Menu lain"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <div id="stage">
    <div id="mainWrap">
      <div id="loading">Memuat chart…</div>
      <div id="chart"></div>
      <canvas id="overlay"></canvas>
      <div id="legend"></div>
      <div id="toolbar" class="collapsed">
        <button id="tbToggle" aria-label="Alat gambar"></button>
      </div>
      <div id="selBar"></div>
      <div id="hint"></div>
    </div>
    <div id="panes"></div>
  </div>
</div>

<dialog id="dlgSym">
  <div class="dlg-h">Pilih pair<button class="x" data-close aria-label="Tutup">×</button></div>
  <div class="tabs" id="symTabs">
    <button class="tab" data-cat="crypto">Crypto</button><button class="tab" data-cat="forex">Forex</button><button class="tab" data-cat="saham">Saham</button><button class="tab" data-cat="komoditas">Komoditas</button>
  </div>
  <div class="dlg-b">
    <input id="search" class="inp" placeholder="Cari…" autocomplete="off" autocapitalize="characters" enterkeyhint="search">
    <div class="err" id="searchErr"></div>
    <div class="grid" id="symGrid"></div>
    <div class="note" id="catNote"></div>
  </div>
</dialog>

<dialog id="dlgInd">
  <div class="dlg-h">Indikator<button class="x" data-close aria-label="Tutup">×</button></div>
  <div class="dlg-b" id="indList"></div>
</dialog>

<dialog id="dlgType">
  <div class="dlg-h">Tipe chart<button class="x" data-close aria-label="Tutup">×</button></div>
  <div class="dlg-b"><div class="menu" id="typeList"></div></div>
</dialog>

<dialog id="dlgMore">
  <div class="dlg-h">Menu<button class="x" data-close aria-label="Tutup">×</button></div>
  <div class="dlg-b"><div class="menu" id="moreList"></div><div class="note" id="moreNote"></div></div>
</dialog>

<dialog id="dlgText">
  <div class="dlg-h"><span id="txtTitle">Teks</span><button class="x" data-close aria-label="Tutup">×</button></div>
  <div class="dlg-b">
    <input id="txtInput" class="inp" autocomplete="off" enterkeyhint="done">
    <div class="note" id="txtNote"></div>
    <button class="btn" id="txtOk">Simpan</button>
  </div>
</dialog>

<script src="lightweight-charts.standalone.production.js"></script>
<script src="app.js"></script>
</body>
</html>
